name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Manager
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: Alex_ACT_Manager
      - name: Check out approved Core source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fabioc-aloha/Alex_ACT_Core
          ref: 0aecdb105ba0c285fa88997ca2ea0398a79332e4
          path: Alex_ACT_Core
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run contract tests
        working-directory: Alex_ACT_Manager
        run: npm test
